<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc">
<title id="title">From Observation to Trusted Memory</title>
<desc id="desc">Flow from observation to candidate, evidence or confirmation, active memory, and agent context, with candidate-only and admissible evidence callouts.</desc>

<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L12,6 L0,12 z" fill="#1f59c8"/>
  </marker>
  <marker id="arrowgray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L12,6 L0,12 z" fill="#717981"/>
  </marker>
</defs>


<style>
  .bg { fill: #ffffff; }
  .title { font: 700 58px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif; fill:#15191f; }
  .subtitle { font: 400 30px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif; fill:#23272e; }
  .h1 { font: 700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif; fill:#15191f; }
  .h2 { font: 700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif; fill:#15191f; }
  .body { font: 400 23px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif; fill:#171b20; }
  .small { font: 400 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif; fill:#30353c; }
  .smallblue { font: 400 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif; fill:#1f59c8; }
  .caption { font: italic 400 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif; fill:#30353c; }
  .box { fill:#fff; stroke:#1f59c8; stroke-width:2; rx:14; }
  .softbox { fill:#f5f8ff; stroke:#1f59c8; stroke-width:2; rx:14; }
  .graybox { fill:#fff; stroke:#6f7780; stroke-width:1.8; rx:14; }
  .dashbox { fill:#fff; stroke:#1f59c8; stroke-width:2; stroke-dasharray:5 5; rx:14; }
  .dashgray { fill:#fff; stroke:#7a828a; stroke-width:1.8; stroke-dasharray:5 5; rx:14; }
  .line { stroke:#1f59c8; stroke-width:3; fill:none; }
  .dashline { stroke:#1f59c8; stroke-width:2.5; fill:none; stroke-dasharray:5 6; }
  .dashgrayline { stroke:#717981; stroke-width:2.2; fill:none; stroke-dasharray:6 6; }
  .pill { fill:#fff; stroke:#1f59c8; stroke-width:1.7; rx:10; }
  .pillblue { fill:#2b67d5; stroke:#2b67d5; stroke-width:1.5; rx:10; }
  .pillgray { fill:#e3e3e3; stroke:#d6d6d6; stroke-width:1.2; rx:10; }
  .pilltext { font: 400 19px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif; fill:#171b20; }
  .pilltextwhite { font: 600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif; fill:#fff; }
  .blue { fill:#1f59c8; }
  .muted { fill:#5d6670; }
</style>

<rect class="bg" x="0" y="0" width="1448" height="1086"/>

<text class="title" x="724" y="82" text-anchor="middle">From Observation to Trusted Memory</text>
<text class="subtitle" x="724" y="140" text-anchor="middle">Persistence should not automatically grant authority.</text>

<rect class="box" x="492" y="188" width="464" height="98"/>
<text class="h1" x="724" y="252" text-anchor="middle">1. Observation</text>

<path class="line" d="M724 286 L724 342" marker-end="url(#arrow)"/>

<rect class="box" x="492" y="345" width="464" height="116"/>
<text class="h1" x="724" y="405" text-anchor="middle">2. Candidate</text>
<text class="smallblue" x="724" y="439" text-anchor="middle">inbox.md</text>

<rect class="dashbox" x="33" y="359" width="349" height="198"/>
<text class="h2" x="69" y="417">Candidate-only evidence</text>
<text class="body" x="68" y="473">• agent-observed</text>
<text class="body" x="68" y="516">• conversation-unconfirmed</text>
<path class="dashline" d="M382 399 L490 399" marker-end="url(#arrow)"/>

<path class="dashline" d="M956 423 L1007 423"/>
<text class="caption" x="1027" y="390">preserve ideas</text>
<text class="caption" x="1027" y="424">without granting policy</text>

<path class="line" d="M724 461 L724 516" marker-end="url(#arrow)"/>

<rect class="box" x="492" y="520" width="464" height="112"/>
<text class="h1" x="724" y="588" text-anchor="middle">3. Evidence / confirmation</text>

<rect class="dashbox" x="1030" y="491" width="328" height="252"/>
<text class="h2" x="1073" y="542">Eligible for admission</text>
<text class="body" x="1072" y="590">• user-confirmed</text>
<text class="body" x="1072" y="628">• repo:</text>
<text class="body" x="1072" y="666">• doc:</text>
<text class="body" x="1072" y="704">• test:</text>
<text class="body" x="1072" y="742">• issue / PR</text>
<path class="dashline" d="M1030 575 L958 575" marker-end="url(#arrow)"/>

<path class="line" d="M724 632 L724 686" marker-end="url(#arrow)"/>

<rect class="box" x="492" y="690" width="464" height="112"/>
<text class="h1" x="724" y="758" text-anchor="middle">4. Active Memory</text>

<path class="dashline" d="M956 781 L1007 781"/>
<text class="caption" x="1027" y="792">trusted enough</text>
<text class="caption" x="1027" y="826">to guide future work</text>

<path class="line" d="M724 802 L724 858" marker-end="url(#arrow)"/>

<rect class="box" x="492" y="862" width="464" height="122"/>
<text class="h1" x="724" y="921" text-anchor="middle">5. Agent Context</text>
<text class="smallblue" x="724" y="959" text-anchor="middle">via manifest routing</text>

</svg>