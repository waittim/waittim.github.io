<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <rect width="1600" height="950" fill="white"/>
  <text x="80" y="90" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#111827">
    Figure 1. Source geometry and PDF layout are separate decisions
  </text>
  <text x="80" y="128" font-family="Inter, Arial, sans-serif" font-size="22" fill="#4B5563">
    Detect the photographed source first, then place the corrected result into the chosen page layout.
  </text>

  <text x="285" y="205" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" fill="#374151" text-anchor="middle">1. Photographed source</text>
  <text x="800" y="205" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" fill="#374151" text-anchor="middle">2. Rectified source</text>
  <text x="1315" y="205" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" fill="#374151" text-anchor="middle">3. PDF layout</text>

  <rect x="70" y="245" width="430" height="430" rx="24" fill="#F3F4F6" stroke="#E5E7EB"/>
  <polygon points="145,545 165,330 420,300 405,560" fill="white" stroke="#2563EB" stroke-width="8"/>
  <line x1="145" y1="545" x2="420" y2="300" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="165" y1="330" x2="405" y2="560" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="145" cy="545" r="7" fill="#2563EB"/>
  <circle cx="165" cy="330" r="7" fill="#2563EB"/>
  <circle cx="420" cy="300" r="7" fill="#2563EB"/>
  <circle cx="405" cy="560" r="7" fill="#2563EB"/>
  <text x="285" y="620" font-family="Inter, Arial, sans-serif" font-size="24" fill="#374151" text-anchor="middle">Angled 16:9 slide in a photo</text>
  <rect x="125" y="370" width="80" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="165" y="396" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#2563EB" text-anchor="middle">source</text>

  <rect x="585" y="245" width="430" height="430" rx="24" fill="#F3F4F6" stroke="#E5E7EB"/>
  <rect x="655" y="365" width="290" height="163" rx="6" fill="white" stroke="#2563EB" stroke-width="8"/>
  <line x1="655" y1="446.5" x2="945" y2="446.5" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="800" y1="365" x2="800" y2="528" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="800" y="575" font-family="Inter, Arial, sans-serif" font-size="24" fill="#374151" text-anchor="middle">Recovered as true source geometry</text>
  <rect x="723" y="302" width="154" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="800" y="328" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#2563EB" text-anchor="middle">16:9 source format</text>

  <rect x="1110" y="245" width="430" height="430" rx="24" fill="#F3F4F6" stroke="#E5E7EB"/>
  <rect x="1218" y="318" width="214" height="285" rx="6" fill="white" stroke="#374151" stroke-width="4"/>
  <rect x="1244" y="379" width="162" height="91" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="6"/>
  <text x="1325" y="514" font-family="Inter, Arial, sans-serif" font-size="21" fill="#374151" text-anchor="middle">
    <tspan x="1325" dy="0">Placed into A4</tspan>
    <tspan x="1325" dy="28">landscape PDF</tspan>
  </text>
  <text x="1325" y="570" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6B7280" text-anchor="middle">with margins preserved</text>
  <rect x="1240" y="275" width="170" height="38" rx="10" fill="#F3F4F6" stroke="#D1D5DB"/>
  <text x="1325" y="301" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#374151" text-anchor="middle">A4 page layout</text>

  <line x1="500" y1="460" x2="565" y2="460" stroke="#9CA3AF" stroke-width="5"/>
  <polygon points="565,460 548,450 548,470" fill="#9CA3AF"/>
  <line x1="1015" y1="460" x2="1090" y2="460" stroke="#9CA3AF" stroke-width="5"/>
  <polygon points="1090,460 1073,450 1073,470" fill="#9CA3AF"/>

  <rect x="505" y="420" width="145" height="34" rx="17" fill="white" stroke="#D1D5DB"/>
  <text x="577" y="443" font-family="Inter, Arial, sans-serif" font-size="17" fill="#374151" text-anchor="middle">detect + rectify</text>
  <rect x="1015" y="420" width="120" height="34" rx="17" fill="white" stroke="#D1D5DB"/>
  <text x="1075" y="443" font-family="Inter, Arial, sans-serif" font-size="17" fill="#374151" text-anchor="middle">compose</text>

  <rect x="80" y="745" width="1440" height="120" rx="22" fill="#F3F4F6" stroke="#E5E7EB"/>
  <circle cx="128" cy="805" r="24" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="128" y="813" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#DC2626" text-anchor="middle">×</text>
  <text x="170" y="795" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#111827">
    Do not stretch source detection to match the PDF page.
  </text>
  <text x="170" y="830" font-family="Inter, Arial, sans-serif" font-size="22" fill="#4B5563">
    Recognition should recover the photographed object first. Layout decisions happen afterward.
  </text>
</svg>
