<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <rect width="1600" height="1080" fill="white"/>
  <text x="80" y="88" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="700" fill="#111827">Figure 3. Batch geometry prior helps uncertain pages without copying previous crops</text>
  <text x="80" y="132" font-family="Inter, Arial, sans-serif" font-size="20" fill="#4B5563">Reliable pages form a geometry cluster. The median prior becomes another candidate and still must pass current-image evidence checks.</text>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <g transform="translate(80,190)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="250" rx="18" fill="white" stroke="#E5E7EB"/>
    <text x="18" y="28" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#374151">Photo 1</text>
    <rect x="164" y="14" width="42" height="24" rx="12" fill="#ECFDF5" stroke="#86EFAC"/>
    <text x="185" y="31" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16A34A" text-anchor="middle">0.91</text>
    <rect x="22" y="50" width="176" height="168" rx="10" fill="#F3F4F6" stroke="#E5E7EB"/>
    <polygon points="42,188 52,88 182,78 176,190" fill="white" stroke="#2563EB" stroke-width="5"/>
    <text x="110" y="235" font-family="Inter, Arial, sans-serif" font-size="16" fill="#6B7280" text-anchor="middle">reliable anchor</text>
  </g>

  <g transform="translate(340,190)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="250" rx="18" fill="white" stroke="#E5E7EB"/>
    <text x="18" y="28" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#374151">Photo 2</text>
    <rect x="164" y="14" width="42" height="24" rx="12" fill="#ECFDF5" stroke="#86EFAC"/>
    <text x="185" y="31" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16A34A" text-anchor="middle">0.88</text>
    <rect x="22" y="50" width="176" height="168" rx="10" fill="#F3F4F6" stroke="#E5E7EB"/>
    <polygon points="44,190 52,92 180,80 174,188" fill="white" stroke="#2563EB" stroke-width="5"/>
    <text x="110" y="235" font-family="Inter, Arial, sans-serif" font-size="16" fill="#6B7280" text-anchor="middle">reliable anchor</text>
  </g>

  <g transform="translate(600,190)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="250" rx="18" fill="white" stroke="#E5E7EB"/>
    <text x="18" y="28" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#374151">Photo 3</text>
    <rect x="164" y="14" width="42" height="24" rx="12" fill="#ECFDF5" stroke="#86EFAC"/>
    <text x="185" y="31" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16A34A" text-anchor="middle">0.90</text>
    <rect x="22" y="50" width="176" height="168" rx="10" fill="#F3F4F6" stroke="#E5E7EB"/>
    <polygon points="43,189 51,89 181,81 175,191" fill="white" stroke="#2563EB" stroke-width="5"/>
    <text x="110" y="235" font-family="Inter, Arial, sans-serif" font-size="16" fill="#6B7280" text-anchor="middle">reliable anchor</text>
  </g>

  <g transform="translate(920,190)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="250" rx="18" fill="white" stroke="#E5E7EB"/>
    <text x="18" y="28" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#374151">Photo 4</text>
    <rect x="160" y="14" width="46" height="24" rx="12" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="183" y="31" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#D97706" text-anchor="middle">0.53</text>
    <rect x="22" y="50" width="176" height="168" rx="10" fill="#F3F4F6" stroke="#E5E7EB"/>
    <polygon points="48,190 58,94 174,87 170,188" fill="white" stroke="#9CA3AF" stroke-width="5" stroke-dasharray="8 6"/>
    <rect x="48" y="78" width="114" height="94" rx="6" fill="#111827" opacity="0.25"/>
    <text x="110" y="235" font-family="Inter, Arial, sans-serif" font-size="16" fill="#6B7280" text-anchor="middle">uncertain page</text>
  </g>

  <g transform="translate(1180,190)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="250" rx="18" fill="white" stroke="#E5E7EB"/>
    <text x="18" y="28" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#374151">Photo 5</text>
    <rect x="164" y="14" width="42" height="24" rx="12" fill="#ECFDF5" stroke="#86EFAC"/>
    <text x="185" y="31" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#16A34A" text-anchor="middle">0.86</text>
    <rect x="22" y="50" width="176" height="168" rx="10" fill="#F3F4F6" stroke="#E5E7EB"/>
    <polygon points="45,190 54,91 180,81 174,188" fill="white" stroke="#2563EB" stroke-width="5"/>
    <text x="110" y="235" font-family="Inter, Arial, sans-serif" font-size="16" fill="#6B7280" text-anchor="middle">reliable anchor</text>
  </g>

  <line x1="190" y1="455" x2="700" y2="455" stroke="#93C5FD" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="820" y1="455" x2="1290" y2="455" stroke="#93C5FD" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="445" y1="455" x2="445" y2="505" stroke="#93C5FD" stroke-width="4"/>
  <line x1="1055" y1="455" x2="1055" y2="505" stroke="#93C5FD" stroke-width="4"/>

  <rect x="430" y="505" width="650" height="92" rx="22" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="755" y="543" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#2563EB" text-anchor="middle">
    Reliable geometry cluster
  </text>
  <text x="755" y="569" font-family="Inter, Arial, sans-serif" font-size="17" fill="#374151" text-anchor="middle">
    <tspan x="755" dy="0">use only high-confidence, non-fallback pages</tspan>
    <tspan x="755" dy="22">with low geometric variance</tspan>
  </text>

  <line x1="755" y1="597" x2="755" y2="655" stroke="#2563EB" stroke-width="5"/>
  <polygon points="755,655 744,637 766,637" fill="#2563EB"/>

  <rect x="620" y="670" width="270" height="78" rx="20" fill="white" stroke="#2563EB" stroke-width="3"/>
  <text x="755" y="700" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#2563EB" text-anchor="middle">
    Median prior quad
  </text>
  <text x="755" y="724" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">
    <tspan x="755" dy="0">another candidate,</tspan>
    <tspan x="755" dy="16">not a copied crop</tspan>
  </text>

  <line x1="890" y1="709" x2="1040" y2="709" stroke="#9CA3AF" stroke-width="4" stroke-dasharray="10 8"/>
  <polygon points="1040,709 1023,699 1023,719" fill="#9CA3AF"/>
  <text x="965" y="679" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4B5563" text-anchor="middle">
    <tspan x="965" dy="0">map into</tspan>
    <tspan x="965" dy="16">uncertain page</tspan>
  </text>

  <g transform="translate(1060,625)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="270" rx="20" fill="white" stroke="#E5E7EB"/>
    <text x="24" y="34" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#374151">Uncertain page retry</text>
    <rect x="24" y="52" width="272" height="178" rx="10" fill="#F3F4F6" stroke="#E5E7EB"/>
    <polygon points="56,204 69,90 241,82 234,202" fill="none" stroke="#2563EB" stroke-width="5" stroke-dasharray="10 7"/>
    <polygon points="64,196 73,100 235,88 228,198" fill="none" stroke="#16A34A" stroke-width="6"/>
    <rect x="62" y="96" width="112" height="90" rx="8" fill="#111827" opacity="0.22"/>
    <text x="160" y="242" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280" text-anchor="middle">dashed = prior candidate</text>
    <text x="160" y="262" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B7280" text-anchor="middle">solid = refined result</text>
  </g>

  <line x1="1220" y1="896" x2="1220" y2="952" stroke="#9CA3AF" stroke-width="4"/>
  <polygon points="1220,952 1209,934 1231,934" fill="#9CA3AF"/>

  <rect x="1025" y="962" width="390" height="78" rx="20" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="1220" y="996" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">
    Current-image evidence check
  </text>
  <text x="1220" y="1016" font-family="Inter, Arial, sans-serif" font-size="14" fill="#4B5563" text-anchor="middle">
    <tspan x="1220" dy="0">accept only if the current photo</tspan>
    <tspan x="1220" dy="16">supports the refined boundary</tspan>
  </text>

  <rect x="80" y="780" width="820" height="210" rx="24" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="120" y="825" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">
    Why this is safer than reusing the last crop
  </text>
  <text x="120" y="870" font-family="Inter, Arial, sans-serif" font-size="20" fill="#374151">
    1. Only reliable pages become anchors.
  </text>
  <text x="120" y="905" font-family="Inter, Arial, sans-serif" font-size="20" fill="#374151">
    2. The batch prior is just one more candidate.
  </text>
  <text x="120" y="940" font-family="Inter, Arial, sans-serif" font-size="20" fill="#374151">
    3. The uncertain page still needs its own edge evidence before acceptance.
  </text>
</svg>
