<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Explainable Context Routing</title>
  <desc id="desc">Declared task and scope inputs flow through the MemoryCustodian manifest into deterministic routing. Every governed module receives a disposition such as loaded, skipped, missing, or invalid. Routing completeness is reported separately from the bounded context pack and entry-level budget omissions.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#64748B"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#020617" flood-opacity="0.08"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .title { font-size: 42px; font-weight: 700; fill: #020617; }
      .subtitle { font-size: 20px; fill: #475569; }
      .section { font-size: 21px; font-weight: 700; fill: #020617; }
      .body { font-size: 18px; fill: #334155; }
      .small { font-size: 16px; fill: #64748B; }
      .pill { font-size: 16px; font-weight: 700; }
      .code { font-size: 16px; fill: #0F172A; }
      .dark-section { font-size: 21px; font-weight: 700; fill: #F8FAFC; }
      .dark-body { font-size: 18px; fill: #CBD5E1; }
      .dark-small { font-size: 16px; fill: #94A3B8; }
      .dark-code { font-size: 16px; fill: #CBD5E1; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#F8FAFC"/>

  <text x="80" y="82" class="sans title">Explainable Context Routing</text>
  <text x="80" y="118" class="sans subtitle">Deterministic selection should account for both loaded context and explicit omissions.</text>

  <!-- Stage 1: inputs -->
  <g filter="url(#shadow)">
    <rect x="80" y="185" width="330" height="405" rx="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  </g>
  <circle cx="116" cy="222" r="18" fill="#2563EB"/>
  <text x="116" y="229" text-anchor="middle" class="sans pill" fill="#FFFFFF">1</text>
  <text x="150" y="230" class="sans section">Declared inputs</text>

  <g class="sans">
    <rect x="112" y="270" width="266" height="56" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="134" y="305" class="body">Canonical task</text>

    <rect x="112" y="342" width="266" height="56" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="134" y="377" class="body">Planned / touched paths</text>

    <rect x="112" y="414" width="266" height="56" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="134" y="449" class="body">Explicit rules / profiles</text>

    <rect x="112" y="486" width="266" height="56" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="134" y="521" class="body">Explicit areas</text>
  </g>

  <path d="M410 388 H485" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Stage 2: manifest -->
  <g filter="url(#shadow)">
    <rect x="505" y="235" width="300" height="305" rx="26" fill="#020617"/>
  </g>
  <circle cx="541" cy="272" r="18" fill="#2563EB"/>
  <text x="541" y="279" text-anchor="middle" class="sans pill" fill="#FFFFFF">2</text>
  <text x="575" y="280" class="sans dark-section">manifest.md</text>

  <text x="537" y="326" class="mono dark-code">routing_policy:</text>
  <text x="537" y="354" class="mono dark-code" style="fill:#F8FAFC">explicit-task-and-scope</text>

  <line x1="537" y1="385" x2="773" y2="385" stroke="#334155"/>

  <text x="537" y="425" class="sans dark-body">Only declared policy</text>
  <text x="537" y="454" class="sans dark-body">controls activation.</text>

  <text x="537" y="498" class="sans dark-small">No hidden keyword scan</text>
  <text x="537" y="522" class="sans dark-small">No embedding authority</text>

  <path d="M805 388 H875" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Stage 3: module accountability -->
  <g filter="url(#shadow)">
    <rect x="895" y="165" width="625" height="445" rx="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  </g>
  <circle cx="931" cy="202" r="18" fill="#2563EB"/>
  <text x="931" y="209" text-anchor="middle" class="sans pill" fill="#FFFFFF">3</text>
  <text x="965" y="210" class="sans section">Every governed module gets a disposition</text>

  <g class="sans">
    <rect x="930" y="255" width="170" height="112" rx="18" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
    <circle cx="966" cy="291" r="10" fill="#2563EB"/>
    <text x="988" y="299" class="pill" fill="#1D4ED8">loaded</text>
    <text x="954" y="326" class="small">Selected and</text>
    <text x="954" y="348" class="small">present</text>

    <rect x="1118" y="255" width="170" height="112" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="1154" cy="291" r="10" fill="#64748B"/>
    <text x="1176" y="299" class="pill" fill="#334155">skipped</text>
    <text x="1142" y="326" class="small">Policy did not</text>
    <text x="1142" y="348" class="small">activate</text>

    <rect x="1306" y="255" width="178" height="112" rx="18" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
    <circle cx="1342" cy="291" r="10" fill="#EA580C"/>
    <text x="1364" y="299" class="pill" fill="#C2410C">missing</text>
    <text x="1330" y="326" class="small">Required / optional</text>
    <text x="1330" y="348" class="small">module absent</text>

    <rect x="1024" y="392" width="210" height="112" rx="18" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
    <circle cx="1060" cy="428" r="10" fill="#DC2626"/>
    <text x="1082" y="436" class="pill" fill="#B91C1C">invalid</text>
    <text x="1048" y="472" class="small">Protocol or input error</text>

    <rect x="1252" y="392" width="232" height="112" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1278" y="429" class="pill" fill="#334155">stable reason code</text>
    <text x="1278" y="458" class="mono small">MC-ROUTE-…</text>
    <text x="1278" y="482" class="mono small">MC-SKIP-…</text>
  </g>

  <text x="930" y="553" class="sans small">Presence and absence are both part of the routing result.</text>

  <path d="M1170 610 V672" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <g filter="url(#shadow)">
    <rect x="660" y="695" width="450" height="130" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  </g>
  <text x="692" y="734" class="sans section">Routing completeness</text>
  <g class="sans">
    <rect x="692" y="758" width="112" height="40" rx="20" fill="#DCFCE7"/>
    <text x="748" y="784" text-anchor="middle" class="pill" fill="#166534">COMPLETE</text>

    <rect x="816" y="758" width="128" height="40" rx="20" fill="#FFF7ED"/>
    <text x="880" y="784" text-anchor="middle" class="pill" fill="#C2410C">INCOMPLETE</text>

    <rect x="956" y="758" width="112" height="40" rx="20" fill="#FEF2F2"/>
    <text x="1012" y="784" text-anchor="middle" class="pill" fill="#B91C1C">INVALID</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1140" y="695" width="380" height="130" rx="24" fill="#020617"/>
  </g>
  <text x="1172" y="734" class="sans dark-section">Bounded context pack</text>
  <text x="1172" y="770" class="sans dark-body">Included complete entries</text>
  <text x="1172" y="801" class="sans dark-body" style="fill:#93C5FD">+ separate budget omissions</text>

  <path d="M1110 760 H1140" stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <text x="80" y="856" class="sans small">Structural completeness explains whether routing inputs were sufficient. It does not prove semantic relevance or factual correctness.</text>
</svg>