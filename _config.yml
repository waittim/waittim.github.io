# Site settings
title: Zekun Blog
author_name: Zekun Wang
SEOTitle: Zekun Blog - AI Agent Systems & LLM Evaluation
header-img: img/ui/bg-ice.webp
default_image: /img/ui/home-bg-o.jpg
email: zekun.wang.us@gmail.com
description: "Building and evaluating AI-powered products, agent systems, and local-first developer tools."
keyword: "Zekun Wang, 王泽坤, AI agents, LLM evaluation, coding agents, agent memory, developer tools, browser AI, local-first software"
url: "https://www.zekun.blog"          # your host, for absolute URL
baseurl: ""      # for example, '/blog' if your blog hosted on 'host/blog'
github_repo: "https://github.com/waittim/waittim.github.io.git" # you code repository

# Sidebar settings
sidebar: true                           # whether or not using Sidebar.
sidebar-about-description: "Building AI agent systems that can be evaluated, improved, and trusted."
sidebar-avatar: /img/ui/Zekun_Wang_icon.webp      # use absolute URL, seeing it's used in both `/` and `/about/`



# Icon row for the footer and sidebar. RSS stays site-relative.
# Absolute URLs open in a new tab; do not repeat these in elsewhere.
profiles:
  - title: RSS
    icon: rss
    href: /feed.xml
  - title: GitHub
    icon: github
    href: https://github.com/waittim
  - title: LinkedIn
    icon: linkedin
    href: https://www.linkedin.com/in/zekun-wang/

# Primary navigation, in display order. Pages are not collected from site.pages.
nav:
  - title: Home
    url: /
  - title: About
    url: /about/
  - title: Tags
    url: /tags/
  - title: Search
    url: /search/




# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
permalink: pretty
paginate: 10
exclude:
  - less
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - README.md
  # Local intermediates from npm run build:assets. Pages serves the minified CSS.
  - css/bootstrap.css
  - css/hux-blog.css
  - css/theme.css
  # Keep a returned Codecov config off the published site; it can hold an upload token.
  - codecov.yml
  - data
  - .venv-img
anchorjs: true                          # if you want to customize anchor. check out line:181 of `post.html`



# Gems
# from PR#40, to support local preview for Jekyll 3.0
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from




# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: https://jekyllrb.com/docs/configuration/markdown/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM                            # use Github Flavored Markdown !important



# 评论系统
# Utterances uses GitHub Issues and does not require committing OAuth secrets.
comments:
  provider: utterances
  utterances:
    repo: waittim/waittim.github.io
    issue_term: pathname
    theme: preferred-color-scheme


# 统计

# Analytics settings
# Baidu Analytics
# ba_track_id: b50bf2b12b5338a1845e33832976fd68

# Google Analytics 4
ga4_measurement_id: 'G-Z19ZNE4PP1'





# Current topics are curated independently from historical post counts.
current_topics:
  - Agent
  - AI
  - Local-First
  - Computer Vision
  - Web Application



# Cache-busting for local CSS/JS. Rewritten by npm run build:assets.
asset_version: "20261015-03"


# Project and other long links. Do not repeat profiles.
elsewhere:
  - title: MemoryCustodian
    href: https://github.com/waittim/MemoryCustodian
  - title: Slides Thief
    href: https://slidesthief.com/
