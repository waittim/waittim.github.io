<!-- Navigation -->
<nav class="navbar navbar-default navbar-custom navbar-fixed-top" aria-label="Primary navigation">
    <div class="container-fluid">
        <!-- Brand and toggle get grouped for better mobile display -->
        <div class="navbar-header page-scroll">
            <button type="button"
                    class="navbar-toggle"
                    aria-controls="huxblog_navbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="{{ "/" | relative_url }}">{{ site.title }}</a>
        </div>

        <!-- Collect the nav links, forms, and other content for toggling -->
        <div id="huxblog_navbar">
            <div class="navbar-collapse">
                <ul class="nav navbar-nav navbar-right">
                    {% for item in site.nav %}
                    <li>
                        <a href="{{ item.url | relative_url }}">{{ item.title | escape }}</a>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
        <!-- /.navbar-collapse -->
    </div>
    <!-- /.container -->
</nav>
<script>
    // Drop Bootstarp low-performance Navbar
    // Use customize navbar with high-quality material design animation
    // in high-perf jank-free CSS3 implementation
    var $body   = document.body;
    var $toggle = document.querySelector('.navbar-toggle');
    var $navbar = document.querySelector('#huxblog_navbar');
    var $collapse = document.querySelector('.navbar-collapse');
    var closeTimer = null;

    var __HuxNav__ = {
        close: function(){
            if (closeTimer) {
                clearTimeout(closeTimer);
            }
            $navbar.classList.remove('in');
            $toggle.setAttribute("aria-expanded", "false");
            closeTimer = setTimeout(function(){
                if (!$navbar.classList.contains('in')) {
                    $collapse.style.height = "0px";
                }
            }, 250);
        },
        open: function(){
            if (closeTimer) {
                clearTimeout(closeTimer);
                closeTimer = null;
            }
            $collapse.style.height = "auto";
            $navbar.classList.add('in');
            $toggle.setAttribute("aria-expanded", "true");
        }
    };

    // Bind Event
    $toggle.addEventListener('click', function(e){
        if ($navbar.classList.contains('in')) {
            __HuxNav__.close();
        } else {
            __HuxNav__.open();
        }
    });

    // Close mobile nav when clicking outside the toggle control or dropdown
    document.addEventListener('click', function(e){
        if ($toggle.contains(e.target)) return;
        if ($navbar.contains(e.target)) return;
        __HuxNav__.close();
    });
</script>
