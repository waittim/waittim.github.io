{% if site.current_topics %}
<section>
    <hr class="hidden-sm hidden-xs">
    <h5><a href="{{ '/tags/' | relative_url }}">CURRENT TOPICS</a></h5>
    <div class="tags">
        {% for topic in site.current_topics %}{% assign topic_anchor = topic | replace: ' ', '%20' %}<a href="{{ '/tags/' | relative_url }}#{{ topic_anchor }}" title="{{ topic }}">{{ topic }}</a>{% endfor %}
    </div>
</section>
{% endif %}
