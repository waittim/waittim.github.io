{% comment %}
  Icon row for the footer and sidebar. Source: site.profiles.
  Absolute URLs open in a new tab. Site-relative links, including RSS, do not.
{% endcomment %}
<ul class="list-inline{% if include.center %} text-center{% endif %}">
    {% for profile in site.profiles %}
    <li>
        <a {% if profile.href contains "://" %}target="_blank" rel="noopener noreferrer" href="{{ profile.href | escape }}"{% else %}href="{{ profile.href | relative_url | escape }}"{% endif %} aria-label="{{ profile.title | escape }}">
            {% include sns-icon.html name=profile.icon %}
        </a>
    </li>
    {% endfor %}
</ul>
